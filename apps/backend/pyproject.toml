[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "personal-ai-agent-backend"
version = "1.0.0"
description = "Local FastAPI application for Personal AI Agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "agent-core>=0.9.0",
  "creation-agent>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
